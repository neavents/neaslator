name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Every guard this repo has runs only when someone runs it. That is not a guard.
#
# This estate has shipped: concurrent startup migrations corrupting a schema, a scoped publish staged
# and never sent, a service six contract versions behind, two OTLP exporters disagreeing so logs were
# silently dropped, and a gateway strip-list change that broke every write in another service. Tests
# were written for all of them — and every one of those tests depends on a human remembering to run
# it. CI is the difference between a check and a habit.
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # THE RESTORE CANNOT WORK WITHOUT THIS, AND FAILS AS A 401 THAT NAMES NOTHING.
      #
      # Neavents.Messaging.Contracts comes from https://nuget.pkg.github.com/polatefekaya, which is
      # a PERSONAL account's package feed. secrets.GITHUB_TOKEN is scoped to this repository and can
      # only read packages that this repository owns, so it cannot read that feed at all — no
      # permission setting on the workflow changes that. It needs a personal access token belonging
      # to the account that owns the feed, with read:packages.
      #
      # Checked here rather than discovered at restore, because a missing secret expands to an empty
      # string and NuGet reports "response status code does not indicate success: 401", which reads
      # like an outage rather than a configuration gap.
      - name: Check the package feed credential is present
        run: |
          if [ -z "${{ secrets.NUGET_GITHUB_TOKEN }}" ]; then
            echo "::error::NUGET_GITHUB_TOKEN is not set for this repository."
            echo "The Neavents.* packages live on a personal GitHub Packages feed"
            echo "(nuget.pkg.github.com/polatefekaya) which secrets.GITHUB_TOKEN cannot read."
            echo "Add a repository or organisation secret named NUGET_GITHUB_TOKEN holding a"
            echo "personal access token with read:packages, owned by the account that owns the feed."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Neaslator.slnx
        env:
          # NuGet reads this variable natively; the suffix is the source key from nuget.config.
          # The workflow used to set NUGET_GITHUB_TOKEN instead, which NOTHING reads — no
          # nuget.config in the estate refers to it — so the restore ran unauthenticated.
          NUGET_PACKAGE_SOURCE_CREDENTIALS_GitHub: >-
            {"Username":"${{ secrets.NUGET_GITHUB_USER || 'polatefekaya' }}",
             "ClearTextPassword":"${{ secrets.NUGET_GITHUB_TOKEN }}"}

      # Debug, not Release. Directory.Build.props turns warnings into errors in Release and the NuGet
      # audit currently fails on pre-existing transitive advisories — a supply-chain issue rather than
      # a test failure. Switch to Release once those are resolved; leaving it here means CI reports
      # what the tests say instead of what the package feed says.
      - name: Build
        run: dotnet build Neaslator.slnx --no-restore -c Debug

      - name: Test
        run: dotnet test Neaslator.slnx --no-build -c Debug --logger "console;verbosity=normal"

