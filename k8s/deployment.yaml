# GENERATED by k8s/generate.py in the estate root — edit the catalogue, not this file.
#
# Listens on 5300, not 8080, and requires X-Internal-Key on its own endpoints.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neaslator
  namespace: neavents
  labels:
    app.kubernetes.io/name: neaslator
    app.kubernetes.io/part-of: neavents
spec:
  # Two, because everything below is written to survive it. The estate's singleton work is
  # held by Postgres advisory locks, its queue consumers compete rather than duplicate, and
  # its caches invalidate across instances — a single replica would hide regressions in all
  # three until the first time someone scaled up, which is the worst moment to find them.
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current capacity during a rollout, and only ever add one pod at
      # a time — the database connection pool is sized for the steady-state replica count.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neaslator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neaslator
        app.kubernetes.io/part-of: neavents
    spec:
      # Spread replicas across nodes where possible, so losing one node cannot take the whole
      # service. Preferred, not required: on a single-node cluster (kind, or a small staging
      # cluster) a hard constraint would leave the second replica permanently Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: neaslator
      securityContext:
        # 1654 is APP_UID in the official .NET base images — the `app` user they already
        # create. Picking an arbitrary uid instead would run as an identity that owns none of
        # the files the runtime expects to read.
        runAsNonRoot: true
        runAsUser: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: neavents/neaslator:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5300
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: "http://+:5300"
            # Invariant globalization is OFF, deliberately, and must stay off.
            #
            # It drops ICU, and ICU is what carries tr-TR. This estate stores and compares
            # Turkish text, where invariant casing is not approximate but wrong — Turkish has a
            # dotless i, so under invariant rules a word stops matching itself. It also resolves
            # IANA time zone ids. The saving is a smaller image; the cost is silently wrong text
            # for most of the customer base.
            - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: neavents-platform
                  key: otelEndpoint
                  optional: true
            - name: ConnectionStrings__NeaslatorDb
              valueFrom:
                secretKeyRef:
                  name: neaslator-secrets
                  key: postgres
                  optional: true
            - name: ConnectionStrings__Garnet
              value: "garnet:6379"
            - name: RabbitMq__Host
              value: "rabbitmq"
            - name: RabbitMq__Username
              value: "guest"
            - name: RabbitMq__Password
              value: "guest"
          envFrom:
            - secretRef:
                name: neaslator-secrets
                optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              # No CPU limit, deliberately. A .NET service that is throttled mid-GC looks like a
              # latency incident and gets misdiagnosed as one; the request already guarantees a
              # share, and the memory limit is what actually protects the node.
              memory: "768Mi"
          volumeMounts:
            # readOnlyRootFilesystem means the runtime needs somewhere to write.
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                # Hold the container open while the endpoint is withdrawn.
                #
                # Kubernetes sends SIGTERM and removes the endpoint at the same moment, and
                # endpoint removal is asynchronous — it has to reach every kube-proxy and
                # ingress. For the seconds that takes, a process already tearing down is still
                # being sent work, which is where the 502s in a rolling deploy come from.
                command: ["/bin/sh", "-c", "sleep 8"]
          # Startup is slower than any later poll: migrations run before the server listens, and
          # they run under an advisory lock, so a replica that loses the race waits for the
          # winner. Without a startupProbe the liveness probe begins on its own schedule and can
          # kill a pod mid-migration — the one moment it must not be interrupted.
          # 30 x 10s = 5 minutes of headroom.
          startupProbe:
            httpGet: { path: /health/live, port: 5300 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            # No initialDelaySeconds: the startupProbe already gates this, and a fixed delay only
            # adds dead time to every rollout.
            httpGet: { path: /health/ready, port: 5300 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # Deliberately slacker than readiness. Readiness failing takes a pod out of rotation;
            # liveness failing restarts it, and restarting a pod whose DEPENDENCY is down turns a
            # dependency outage into a crash-loop that outlives it.
            httpGet: { path: /health/live, port: 5300 }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
      volumes:
        - name: tmp
          emptyDir: {}
      # preStop sleep (8s) + the host's own shutdown drain must both fit inside this, or the
      # kubelet sends SIGKILL mid-drain and undoes both.
      terminationGracePeriodSeconds: 45
