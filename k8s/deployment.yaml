# GENERATED by k8s/generate.py in the estate root — edit k8s/services.json, not this file.
#
# Listens on 5300, not 8080. The quality-upgrade sweep is singleton via an advisory lock.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neaslator
  # Pinned so a bare `kubectl apply -f` cannot land this somewhere else. The overlays all set
  # `namespace: neavents` and Argo's destination is the same, so kustomize's namespace transformer
  # simply reasserts what is already here -- this changes nothing about the supported path and only
  # closes the unsupported one.
  #
  # It was open, and something walked through it: on 2026-08-26 a `kubectl apply` without a namespace
  # created media and media-worker in `default`. They sat there for five days in ImagePullBackOff --
  # no ghcr-pull secret exists in that namespace -- emitting 27,000 FailedToRetrieveImagePullSecret
  # warnings. Nothing owned them, so nothing pruned them: Argo only reconciles what it deployed, and
  # these carried a kubectl last-applied-configuration instead. The estate looked healthy because it
  # WAS healthy; the wreckage was in a namespace nobody reads.
  namespace: neavents
  labels:
    app.kubernetes.io/name: neaslator
    app.kubernetes.io/part-of: neavents
    app.kubernetes.io/component: api
spec:
  # Overridden per environment. Everything below is written to survive more than one replica:
  # singleton work is held by Postgres advisory locks, queue consumers compete rather than
  # duplicate, and caches invalidate across instances.
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below current capacity, and add one pod at a time — the database connection
      # pool is sized per pod, so a surge of new pods is a surge of connections.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neaslator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neaslator
        app.kubernetes.io/part-of: neavents
        app.kubernetes.io/component: api
    spec:
      # ── SPREADING ACROSS NODES ───────────────────────────────────────────────────────────────
      #
      # Both mechanisms, doing different jobs. podAntiAffinity below expresses "not on a node that
      # already has one of me"; topologySpreadConstraints expresses "keep the counts within one of
      # each other", which is the stronger statement and the one that survives a replica count
      # changing.
      #
      # ScheduleAnyway in the base, DoNotSchedule in prod. A hard constraint here would leave the
      # second replica permanently Pending on a single-node cluster, and prod flips it together
      # with the rollout strategy — see the note there, because the two are one decision.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: neaslator
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: neaslator
      # ── PULLING THE IMAGE ────────────────────────────────────────────────────────────────────
      #
      # In the BASE, not only in the prod overlay, because every environment now pulls the same
      # images from ghcr.io/neavents/* and those packages are private.
      #
      # It used to be prod-only, and that arrangement hid a deployment-stopping bug for as long as
      # it existed: the local cluster never pulls at all — build-images.sh imports straight into
      # k3d's containerd — so the registry path was exercised by exactly one environment, and that
      # environment had never been deployed. A fresh production cluster would have scheduled all ten
      # services and sat in ImagePullBackOff on every one, with correct-looking manifests.
      #
      # Making local pull the same way removes the blind spot rather than documenting it.
      # optional: the Secret is created by scripts/create-ghcr-pull-secret.sh at apply time.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        # 1654 is APP_UID in the official .NET base images — the `app` user they already create.
        # Not every service is .NET: a Node image builds its own user, and nginx-unprivileged runs
        # as 101. Forcing 1654 on those produces a container that cannot read its own files, which
        # surfaces as a crash loop with a permission error nobody expects from a manifest.
        runAsNonRoot: true
        runAsUser: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z neavents-pg-pooler-rw 5432; do echo "waiting for postgres..."; sleep 2; done; echo "postgres is up"']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { memory: "32Mi" }
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z neavents-rabbit 5672; do echo "waiting for rabbitmq..."; sleep 2; done; echo "rabbitmq is up"']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { memory: "32Mi" }
      containers:
        - name: app
          image: neavents/neaslator
          ports:
            - name: http
              containerPort: 5300
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: "http://+:5300"
            # Invariant globalization is OFF, deliberately. It drops ICU, and ICU is what carries
            # tr-TR. Turkish has a dotless i, so under invariant casing a word stops matching
            # itself — for most of this customer base. The saving is a smaller image.
            - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: neavents-platform
                  key: otelEndpoint
                  optional: true
            - name: ConnectionStrings__NeaslatorDb
              valueFrom:
                secretKeyRef:
                  name: neaslator-secrets
                  key: postgres
                  optional: true
            - name: ConnectionStrings__PostgresDirect
              valueFrom:
                secretKeyRef:
                  name: neaslator-secrets
                  key: postgresDirect
                  optional: true
            - name: ConnectionStrings__PostgresRead
              valueFrom:
                secretKeyRef:
                  name: neaslator-secrets
                  key: postgresRead
                  optional: true
            - name: ConnectionStrings__Garnet
              value: "garnet:6379"
            - name: RabbitMq__Host
              value: "neavents-rabbit"
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: neavents-rabbit-default-user
                  key: username
                  optional: true
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: neavents-rabbit-default-user
                  key: password
                  optional: true
            - name: OpenTelemetry__OtlpEndpoint
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          envFrom:
            - secretRef:
                name: neaslator-secrets
                optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              # No CPU limit, deliberately. A .NET service throttled mid-GC looks like a latency
              # incident and gets misdiagnosed as one. The request guarantees a share; the memory
              # limit is what protects the node.
              memory: "768Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          lifecycle:
            preStop:
              exec:
                # Kubernetes sends SIGTERM and removes the endpoint at the same moment, and
                # endpoint removal is asynchronous. For the seconds it takes to reach every
                # kube-proxy, a process already tearing down is still being sent work — that is
                # where the 502s in a rolling deploy come from.
                command: ["/bin/sh", "-c", "sleep 8"]
          # Startup is slower than any later poll: migrations run before the server listens, under
          # an advisory lock, so a replica that loses the race waits for the winner. Without this,
          # liveness begins on its own schedule and can kill a pod mid-migration.
          startupProbe:
            # THE DEPENDENCY GATE, and the only probe that should be one.
            #
            # /health/ready checks PostgreSQL, Garnet and RabbitMQ. That belongs here, where it runs
            # until it passes once and then never again: a pod must not join rotation before it can
            # reach the things it needs, and a pod that never can stays 0/1 and says "Startup probe
            # failed" in `kubectl describe` — the most diagnosable failure available.
            #
            # Five minutes of grace (30 x 10s), because a cold start includes migrating.
            httpGet: { path: /health/ready, port: 5300 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            # POINTED AT AN ENDPOINT THAT CHECKS NOTHING EXTERNAL, for the same reason as liveness
            # below but with a subtler consequence, which is why it took a node failure to find.
            #
            # This used to be /health/ready. Stopping the node holding the PostgreSQL primary
            # produced 91 seconds of TOTAL outage, and only the first 50 of those were the cluster
            # noticing the node had gone. The other 41 were self-inflicted: every identity pod
            # checks PostgreSQL in its readiness probe, so when the primary went away they all went
            # unready together — including the ones on healthy nodes that were perfectly able to
            # serve. Traefik then had no backend at all and answered 503 for the whole failover.
            #
            # A shared dependency going down is precisely the case where removing pods from rotation
            # makes things worse. Left in rotation, the application answers: cached reads still
            # work, and anything that truly needs the database returns its own error with a trace id
            # instead of an anonymous 503 from the proxy. Nothing is gained by hiding a pod whose
            # only problem is one every other pod also has.
            #
            # Readiness therefore reports whether THIS pod can serve, and the dependency check has
            # moved to startupProbe, where it gates the first request rather than every request.
            httpGet: { path: /health/live, port: 5300 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # Deliberately slacker than readiness, and pointed at an endpoint that checks NOTHING.
            # Readiness failing takes a pod out of rotation; liveness failing restarts it, and
            # restarting a pod whose DEPENDENCY is down turns a dependency outage into a crash
            # loop that outlives it.
            httpGet: { path: /health/live, port: 5300 }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
      volumes:
        - name: tmp
          emptyDir: {}

      # preStop (8s) plus the host's own shutdown drain must both fit inside this, or the kubelet
      # sends SIGKILL mid-drain and undoes both.
      terminationGracePeriodSeconds: 45
