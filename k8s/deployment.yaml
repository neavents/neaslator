# GENERATED by k8s/generate.py in the estate root — edit k8s/services.json, not this file.
#
# Listens on 5300, not 8080. The quality-upgrade sweep is singleton via an advisory lock.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neaslator
  labels:
    app.kubernetes.io/name: neaslator
    app.kubernetes.io/part-of: neavents
    app.kubernetes.io/component: api
spec:
  # Overridden per environment. Everything below is written to survive more than one replica:
  # singleton work is held by Postgres advisory locks, queue consumers compete rather than
  # duplicate, and caches invalidate across instances.
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below current capacity, and add one pod at a time — the database connection
      # pool is sized per pod, so a surge of new pods is a surge of connections.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neaslator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neaslator
        app.kubernetes.io/part-of: neavents
        app.kubernetes.io/component: api
    spec:
      # Spread replicas across nodes where possible. Preferred, not required: on a single-node
      # cluster a hard constraint leaves the second replica permanently Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: neaslator
      securityContext:
        # 1654 is APP_UID in the official .NET base images — the `app` user they already create.
        runAsNonRoot: true
        runAsUser: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: neavents/neaslator
          ports:
            - name: http
              containerPort: 5300
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: "http://+:5300"
            # Invariant globalization is OFF, deliberately. It drops ICU, and ICU is what carries
            # tr-TR. Turkish has a dotless i, so under invariant casing a word stops matching
            # itself — for most of this customer base. The saving is a smaller image.
            - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: neavents-platform
                  key: otelEndpoint
                  optional: true
            - name: ConnectionStrings__NeaslatorDb
              valueFrom:
                secretKeyRef:
                  name: neaslator-secrets
                  key: postgres
                  optional: true
            - name: ConnectionStrings__PostgresDirect
              valueFrom:
                secretKeyRef:
                  name: neaslator-secrets
                  key: postgresDirect
                  optional: true
            - name: ConnectionStrings__Garnet
              value: "garnet:6379"
            - name: RabbitMq__Host
              value: "rabbitmq"
            - name: RabbitMq__Username
              value: "guest"
            - name: RabbitMq__Password
              value: "guest"
          envFrom:
            - secretRef:
                name: neaslator-secrets
                optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              # No CPU limit, deliberately. A .NET service throttled mid-GC looks like a latency
              # incident and gets misdiagnosed as one. The request guarantees a share; the memory
              # limit is what protects the node.
              memory: "768Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                # Kubernetes sends SIGTERM and removes the endpoint at the same moment, and
                # endpoint removal is asynchronous. For the seconds it takes to reach every
                # kube-proxy, a process already tearing down is still being sent work — that is
                # where the 502s in a rolling deploy come from.
                command: ["/bin/sh", "-c", "sleep 8"]
          # Startup is slower than any later poll: migrations run before the server listens, under
          # an advisory lock, so a replica that loses the race waits for the winner. Without this,
          # liveness begins on its own schedule and can kill a pod mid-migration.
          startupProbe:
            httpGet: { path: /health/live, port: 5300 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 5300 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # Deliberately slacker than readiness, and pointed at an endpoint that checks NOTHING.
            # Readiness failing takes a pod out of rotation; liveness failing restarts it, and
            # restarting a pod whose DEPENDENCY is down turns a dependency outage into a crash
            # loop that outlives it.
            httpGet: { path: /health/live, port: 5300 }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
      volumes:
        - name: tmp
          emptyDir: {}
      # preStop (8s) plus the host's own shutdown drain must both fit inside this, or the kubelet
      # sends SIGKILL mid-drain and undoes both.
      terminationGracePeriodSeconds: 45
